<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Purchase Onboarding | Strategy & Implementation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

        :root {
            --bg-stone: #FAFAF9;
            --stone-900: #1C1917;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-stone);
            color: var(--stone-900);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .ambient-background {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                radial-gradient(at 0% 0%, rgba(231,229,228,.6), transparent 50%),
                radial-gradient(at 100% 0%, rgba(214,211,209,.4), transparent 50%),
                radial-gradient(at 100% 100%, rgba(255,255,255,.8), transparent 50%);
        }

        .texture-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: .4;
            background-image: radial-gradient(#a8a29e .5px, transparent .5px);
            background-size: 24px 24px;
            pointer-events: none;
        }

        h1,h2,h3,h4 { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body>

<div class="ambient-background"></div>
<div class="texture-overlay"></div>

<main class="min-h-screen flex items-center justify-center text-center px-6">
    <div class="max-w-3xl">
        <h1 class="text-4xl md:text-6xl mb-6">Welcome to a lighter workload.</h1>
        <p class="text-stone-600 mb-8">
            Your system is ready. Let’s implement it correctly so it works exactly as intended.
        </p>
        <button class="bg-stone-900 text-white px-8 py-4 rounded-md">
            Book Your Implementation Call
        </button>
    </div>
</main>

</body>
</html>
